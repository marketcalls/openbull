# Dev PostgreSQL. The official image manages its own postgres user; the
# security posture is deliberately simple (see the kustomization header).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: "openbull"
        - name: POSTGRES_PASSWORD
          value: "openbull"
        - name: POSTGRES_DB
          value: "openbull"
        # initdb refuses a data directory that contains lost+found (any ext4
        # volume root does); a PGDATA subdirectory sidesteps it.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "openbull", "-d", "openbull"]
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "openbull", "-d", "openbull"]
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
