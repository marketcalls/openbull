# DEVELOPMENT-ONLY PostgreSQL addon (consumed by overlays/dev).
#
# Single replica, trivial fixed credentials, no backups, no tuning — good
# enough to smoke-test OpenBull on a local cluster. Production instances
# use externally managed PostgreSQL; nothing in base/ assumes this addon
# exists.
#
# Sibling library: do not set namespace: — the consuming overlay supplies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml
- pvc.yaml

labels:
- pairs:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: openbull
  includeSelectors: true
  includeTemplates: true
