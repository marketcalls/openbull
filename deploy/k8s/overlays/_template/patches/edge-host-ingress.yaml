# Ingress host patch (Ingress API variant). Pre-prefix base name.
#
# Strategic-merge patches REPLACE lists wholesale (Ingress rules have no
# merge key), so the full rules list is repeated here — editing only `host`
# would silently drop the / backend. The backend service name is the
# PRE-prefix base name; an overlay namePrefix rewrites it in the build.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbull
spec:
  tls:
  - hosts:
    - CHANGE_ME.example.com
    secretName: CHANGE_ME-openbull-tls
  rules:
  - host: CHANGE_ME.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openbull-http
            port:
              number: 80
