# Per-instance non-sensitive config. Patch targets use the PRE-prefix base
# names — kustomize applies patches before transformers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbull-config
data:
  # Public origin (frontend + OAuth redirect base).
  FRONTEND_URL: "https://CHANGE_ME.example.com"
  # Same origin in production.
  CORS_ORIGINS: "https://CHANGE_ME.example.com"
  # Public market-data WS URL — the SPA fetches it from /api/websocket/config
  # and connects verbatim, so it must resolve to this instance's /ws path.
  WEBSOCKET_URL: "wss://CHANGE_ME.example.com/ws"
  # Brokers exposed by this instance (upstox, zerodha, fyers, dhan, angel).
  VALID_BROKERS: "upstox,zerodha"
