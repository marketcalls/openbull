# Per-instance HTTPRoute. The hostname is patched by the consuming overlay
# (patches/edge-host-gateway.yaml). The Service backendRef and the Gateway
# parentRef are rewritten by the nameReference rules in kustomizeconfig.yaml
# when the overlay uses a namePrefix — verify in the built output that they
# carry the prefix.
#
# Standard channel only. WebSocket upgrades need nothing extra (supported in
# the Standard channel since Gateway API v1.2): both /ws and /ws/strategy/*
# upgrade over this rule. TCPRoute/TLSRoute/UDPRoute are Experimental-channel
# resources and deliberately not used.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbull
spec:
  parentRefs:
  - name: openbull
    sectionName: https
  hostnames:
  - openbull.example.com
  rules:
  # Everything — the in-pod nginx sidecar splits API / WebSocket / SPA
  # paths; the edge only routes host + TLS.
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: openbull-http
      port: 80
