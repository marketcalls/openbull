# Serve the SPA and reverse-proxy backend paths to the `backend` service.
# The backend paths mirror frontend/vite.config.ts's dev proxy exactly.
upstream openbull_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Static assets (hashed) — cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend HTTP paths (same-origin → session cookies pass through).
    location ~ ^/(api|auth|web|upstox|zerodha)/ {
        proxy_pass http://openbull_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://openbull_backend;
        proxy_set_header Host $host;
    }

    # Strategy live-PnL WebSocket.
    location /ws/ {
        proxy_pass http://openbull_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — every other path serves index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
